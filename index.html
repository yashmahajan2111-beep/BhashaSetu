<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BhashaSetu - Language Translator</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

:root{
    --bg1:#11142d;
    --bg2:#35225d;
    --card:rgba(255,255,255,0.92);
    --text:#202020;
    --subtext:#666;
    --blue:#356ee8;
    --purple:#6b24d9;
    --history:rgba(255,255,255,0.15);
}

body.dark{
    --bg1:#070912;
    --bg2:#1c1230;
    --card:#181a27;
    --text:#f5f5f5;
    --subtext:#bdbdbd;
    --history:#222536;
}

body{
    min-height:100vh;
    padding:20px;
    background:
        radial-gradient(circle at 10% 30%, rgba(90,60,200,.35), transparent 25%),
        radial-gradient(circle at 90% 80%, rgba(100,40,255,.30), transparent 25%),
        linear-gradient(135deg,var(--bg1),var(--bg2));
    transition:.3s;
}

.app{
    max-width:650px;
    margin:auto;
}

/* HEADER */

.header{
    color:white;
    text-align:center;
    padding:25px 10px 30px;
    position:relative;
}

.dark-btn{
    position:absolute;
    right:5px;
    top:10px;
    width:45px;
    height:45px;
    border:none;
    border-radius:50%;
    font-size:20px;
    cursor:pointer;
    background:rgba(255,255,255,.18);
    color:white;
}

.brand{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:15px;
}

.logo{
    width:80px;
    height:80px;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:27px;
    font-weight:bold;
    color:#4833b5;
    background:
        linear-gradient(135deg,#b6f0ff,#e5d5ff,#ffd7ee);
    box-shadow:
        0 0 20px rgba(255,255,255,.35),
        inset 0 0 10px white;
}

.brand h1{
    font-size:34px;
    text-align:left;
    line-height:1.05;
}

.tagline{
    margin-top:25px;
    font-size:18px;
    color:#d7d7e5;
}

/* MAIN TRANSLATOR */

.translator{
    background:var(--card);
    padding:22px;
    border-radius:30px;
    box-shadow:0 10px 40px rgba(0,0,0,.25);
}

.language-row{
    display:flex;
    align-items:center;
    gap:12px;
}

.language-box{
    flex:1;
    height:70px;
    border:1px solid #ccc;
    border-radius:20px;
    padding:0 15px;
    font-size:18px;
    background:rgba(255,255,255,.7);
    color:#222;
}

body.dark .language-box{
    background:#242735;
    color:white;
    border-color:#444;
}

.swap-btn{
    width:60px;
    height:60px;
    border:none;
    border-radius:50%;
    font-size:27px;
    color:white;
    cursor:pointer;
    background:linear-gradient(135deg,#159bd3,#6522d4);
    box-shadow:0 5px 15px rgba(60,40,220,.4);
}

/* INPUT AREA */

.text-area{
    margin-top:18px;
    border:1px solid #ddd;
    border-radius:22px;
    padding:15px;
}

body.dark .text-area{
    border-color:#444;
}

textarea{
    width:100%;
    height:150px;
    border:none;
    outline:none;
    resize:none;
    background:transparent;
    color:var(--text);
    font-size:19px;
}

textarea::placeholder{
    color:#999;
}

.tools{
    display:flex;
    justify-content:space-between;
    margin-top:8px;
}

.left-tools,
.right-tools{
    display:flex;
    gap:10px;
}

.icon-btn{
    width:50px;
    height:48px;
    border:none;
    border-radius:14px;
    font-size:23px;
    cursor:pointer;
    background:#edf0f7;
    color:#333;
}

body.dark .icon-btn{
    background:#292d3d;
    color:white;
}

.translate-btn{
    width:100%;
    margin-top:20px;
    padding:19px;
    border:none;
    border-radius:18px;
    cursor:pointer;
    font-size:24px;
    font-weight:bold;
    color:white;
    background:linear-gradient(90deg,#2387dc,#4b50dc,#7316d6);
    box-shadow:0 8px 20px rgba(80,40,220,.35);
}

/* OUTPUT */

.output-box{
    display:none;
    margin-top:18px;
    padding:18px;
    border-radius:18px;
    background:#eef1fa;
    color:#222;
}

body.dark .output-box{
    background:#242735;
    color:white;
}

.output-box h3{
    margin-bottom:10px;
}

#outputText{
    font-size:19px;
    line-height:1.5;
}

/* HISTORY */

.history{
    margin-top:25px;
    padding:20px;
    border-radius:25px;
    background:var(--history);
    backdrop-filter:blur(10px);
    color:white;
}

.history-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

.history-header h2{
    font-size:22px;
}

.clear-history{
    border:none;
    background:#f04f5f;
    color:white;
    padding:10px 17px;
    border-radius:12px;
    font-size:15px;
    cursor:pointer;
}

.history-item{
    background:rgba(255,255,255,.92);
    color:#222;
    padding:16px;
    border-radius:18px;
    margin-top:12px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

body.dark .history-item{
    background:#292d3d;
    color:white;
}

.history-left{
    flex:1;
}

.history-from{
    font-size:17px;
    margin-bottom:5px;
}

.history-to{
    font-size:17px;
    font-weight:bold;
}

.arrow{
    font-size:25px;
}

/* FOOTER */

.footer{
    text-align:center;
    color:#aaa;
    margin:20px;
    font-size:13px;
}

@media(max-width:500px){

    body{
        padding:10px;
    }

    .brand h1{
        font-size:28px;
    }

    .logo{
        width:70px;
        height:70px;
    }

    .language-box{
        font-size:15px;
        height:60px;
    }

    .swap-btn{
        width:52px;
        height:52px;
    }

}

</style>
</head>

<body>

<div class="app">

    <!-- HEADER -->

    <div class="header">

        <button class="dark-btn" onclick="toggleDark()" id="darkBtn">
            🌙
        </button>

        <div class="brand">

            <!-- If you add logo.png later,
            replace this logo div with:
            <img src="logo.png" class="logo-img">
            -->

            <div class="logo">BS</div>

            <h1>
                Bhasha<br>
                Setu
            </h1>

        </div>

        <div class="tagline">
            Connect Languages. Connect People.
        </div>

    </div>


    <!-- TRANSLATOR -->

    <div class="translator">

        <div class="language-row">

            <select class="language-box" id="fromLanguage">

                <option value="en">English</option>
                <option value="hi">Hindi</option>
                <option value="mr">Marathi</option>
                <option value="gu">Gujarati</option>
                <option value="bn">Bengali</option>
                <option value="ta">Tamil</option>
                <option value="te">Telugu</option>

            </select>


            <button class="swap-btn" onclick="swapLanguages()">
                ⇄
            </button>


            <select class="language-box" id="toLanguage">

                <option value="hi">Hindi</option>
                <option value="en">English</option>
                <option value="mr">Marathi</option>
                <option value="gu">Gujarati</option>
                <option value="bn">Bengali</option>
                <option value="ta">Tamil</option>
                <option value="te">Telugu</option>

            </select>

        </div>


        <!-- TEXT INPUT -->

        <div class="text-area">

            <textarea
                id="inputText"
                placeholder="Enter text here..."
            ></textarea>


            <div class="tools">

                <div class="left-tools">

                    <button
                        class="icon-btn"
                        id="voiceBtn"
                        onclick="startVoice()"
                        title="Speak">
                        🎤
                    </button>


                    <button
                        class="icon-btn"
                        onclick="clearText()"
                        title="Clear">
                        🗑️
                    </button>

                </div>


                <div class="right-tools">

                    <button
                        class="icon-btn"
                        onclick="speakOutput()"
                        title="Speak translation">
                        🔊
                    </button>


                    <button
                        class="icon-btn"
                        onclick="copyTranslation()"
                        title="Copy">
                        📋
                    </button>

                </div>

            </div>

        </div>


        <button
            class="translate-btn"
            onclick="translateText()">

            Translate

        </button>


        <!-- OUTPUT -->

        <div class="output-box" id="outputBox">

            <h3>Translation</h3>

            <p id="outputText"></p>

        </div>

    </div>


    <!-- HISTORY -->

    <div class="history">

        <div class="history-header">

            <h2>Translation History</h2>

            <button
                class="clear-history"
                onclick="clearHistory()">

                Clear

            </button>

        </div>

        <div id="historyList"></div>

    </div>


    <div class="footer">
        BhashaSetu • Connect Languages
    </div>

</div>


<script>

/* =========================
   DARK MODE
========================= */

function toggleDark(){

    document.body.classList.toggle("dark");

    let btn = document.getElementById("darkBtn");

    if(document.body.classList.contains("dark")){
        btn.innerHTML = "☀️";
        localStorage.setItem("theme","dark");
    }
    else{
        btn.innerHTML = "🌙";
        localStorage.setItem("theme","light");
    }

}


/* LOAD DARK MODE */

window.onload = function(){

    if(localStorage.getItem("theme") === "dark"){
        document.body.classList.add("dark");
        document.getElementById("darkBtn").innerHTML = "☀️";
    }

    loadHistory();

};


/* =========================
   SWAP LANGUAGES
========================= */

function swapLanguages(){

    let from = document.getElementById("fromLanguage");
    let to = document.getElementById("toLanguage");

    let temp = from.value;

    from.value = to.value;
    to.value = temp;

}


/* =========================
   CLEAR TEXT
========================= */

function clearText(){

    document.getElementById("inputText").value = "";

    document.getElementById("outputText").innerHTML = "";

    document.getElementById("outputBox").style.display = "none";

}


/* =========================
   VOICE INPUT
========================= */

function startVoice(){

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if(!SpeechRecognition){

        alert(
            "Voice recognition is not supported here. Please open the app in Google Chrome and allow microphone permission."
        );

        return;

    }


    let recognition = new SpeechRecognition();


    let language =
        document.getElementById("fromLanguage").value;


    let languageCodes = {

        en:"en-IN",
        hi:"hi-IN",
        mr:"mr-IN",
        gu:"gu-IN",
        bn:"bn-IN",
        ta:"ta-IN",
        te:"te-IN"

    };


    recognition.lang =
        languageCodes[language] || "en-IN";


    recognition.continuous = false;

    recognition.interimResults = false;


    recognition.onstart = function(){

        document.getElementById("voiceBtn").innerHTML = "🔴";

    };


    recognition.onresult = function(event){

        let text =
            event.results[0][0].transcript;


        document.getElementById("inputText").value =
            text;


        document.getElementById("voiceBtn").innerHTML =
            "🎤";

    };


    recognition.onerror = function(event){

        console.log(event.error);

        alert(
            "Voice input error: " + event.error
        );


        document.getElementById("voiceBtn").innerHTML =
            "🎤";

    };


    recognition.onend = function(){

        document.getElementById("voiceBtn").innerHTML =
            "🎤";

    };


    recognition.start();

}


/* =========================
   TRANSLATION
========================= */

async function translateText(){

    let text =
        document.getElementById("inputText").value.trim();


    let from =
        document.getElementById("fromLanguage").value;


    let to =
        document.getElementById("toLanguage").value;


    if(text === ""){

        alert("Please enter or speak some text!");

        return;

    }


    if(from === to){

        showTranslation(text);

        return;

    }


    let button =
        document.querySelector(".translate-btn");


    button.innerHTML = "Translating...";
    button.disabled = true;


    try{

        let url =
            "https://api.mymemory.translated.net/get?q="
            + encodeURIComponent(text)
            + "&langpair="
            + from
            + "|"
            + to;


        let response = await fetch(url);


        let data = await response.json();


        let translatedText =
            data.responseData.translatedText;


        showTranslation(translatedText);


        addHistory(
            text,
            translatedText
        );

    }

    catch(error){

        console.log(error);

        alert(
            "Translation failed. Please check your internet connection."
        );

    }


    button.innerHTML = "Translate";
    button.disabled = false;

}


/* =========================
   SHOW TRANSLATION
========================= */

function showTranslation(text){

    document.getElementById("outputText").innerHTML =
        text;


    document.getElementById("outputBox").style.display =
        "block";

}


/* =========================
   SPEAK OUTPUT
========================= */

function speakOutput(){

    let text =
        document.getElementById("outputText").innerText;


    if(text === ""){

        alert("Translate something first!");

        return;

    }


    speechSynthesis.cancel();


    let speech =
        new SpeechSynthesisUtterance(text);


    let language =
        document.getElementById("toLanguage").value;


    let languageCodes = {

        en:"en-IN",
        hi:"hi-IN",
        mr:"mr-IN",
        gu:"gu-IN",
        bn:"bn-IN",
        ta:"ta-IN",
        te:"te-IN"

    };


    speech.lang =
        languageCodes[language] || "en-IN";


    speech.rate = 0.9;


    speechSynthesis.speak(speech);

}


/* =========================
   COPY TRANSLATION
========================= */

function copyTranslation(){

    let text =
        document.getElementById("outputText").innerText;


    if(text === ""){

        alert("Nothing to copy!");

        return;

    }


    navigator.clipboard.writeText(text)
    .then(function(){

        alert("Translation copied!");

    });

}


/* =========================
   ADD HISTORY
========================= */

function addHistory(original, translated){

    let history =
        JSON.parse(
            localStorage.getItem("bhashaHistory")
        ) || [];


    history.unshift({

        original:original,

        translated:translated

    });


    if(history.length > 10){

        history.pop();

    }


    localStorage.setItem(
        "bhashaHistory",
        JSON.stringify(history)
    );


    loadHistory();

}


/* =========================
   LOAD HISTORY
========================= */

function loadHistory(){

    let history =
        JSON.parse(
            localStorage.getItem("bhashaHistory")
        ) || [];


    let list =
        document.getElementById("historyList");


    list.innerHTML = "";


    if(history.length === 0){

        list.innerHTML =
            "<p style='text-align:center;padding:15px;color:#ddd'>No translation history</p>";

        return;

    }


    history.forEach(function(item){

        let div =
            document.createElement("div");


        div.className =
            "history-item";


        div.innerHTML = `

            <div class="history-left">

                <div class="history-from">
                    ${item.original}
                </div>

            </div>

            <div class="arrow">
                →
            </div>

            <div class="history-to">
                ${item.translated}
            </div>

        `;


        list.appendChild(div);

    });

}


/* =========================
   CLEAR HISTORY
========================= */

function clearHistory(){

    if(confirm("Clear all translation history?")){

        localStorage.removeItem(
            "bhashaHistory"
        );

        loadHistory();

    }

}

</script>

</body>
</html>
